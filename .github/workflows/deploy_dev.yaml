name: Deploy feature branch to shared to dev Environment in VPS

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Deploy via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER_DEV }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "token.js,index.js,package.json,package-lock.json,database.js,controllers,routes,middleware,models,utils"
          target: ${{ vars.TARGET_DIR_DEV }}
          overwrite: true
